<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vecinos en Paz</title>
</head>
<body>

    <header>
        <h1> Vecinos en Paz</h1>
        <p>Plataforma comunitaria para una mejor convivencia.</p>
    </header>

    <section>
        <h2>Tablon de Anuncios</h2>
        <article>
            <h3>Reunion de vecinos</h3>
            <p>Fecha: Viernes a las 20:00 hrs en el salón comunal.</p>
        </article>
    </section>

    
    <section>
        <h2>Reportar un problema</h2>
        <form>
            <label for="nombre">Tu nombre:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Gómez"><br><br>

            <label for="problema">Descripción del problema:</label><br>
            <textarea id="problema" name="problema" placeholder="Ej. Luz de pasillo fundida"></textarea><br><br>

            <button type="submit">Enviar reporte</button>
        </form>
    </section>

</body>
</html>
